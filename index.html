function Card({t, children, style={}}){
  return <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:10,padding:16,...style}}>{children}</div>;
}
function SectionLabel({t, children}){
  return <div style={{fontSize:10,fontFamily:t.mono,letterSpacing:2,color:t.accent,textTransform:'uppercase',marginBottom:12}}>{children}</div>;
}
function AlertBox({t, children}){
  return <div style={{background:t.alertBg,border:`1px solid ${t.alertBorder}`,borderRadius:10,padding:'12px 16px',fontSize:12,color:t.alertColor,lineHeight:1.7,margin:'12px 0'}}>{children}</div>;
}

/* ═══════════════════════════════════════════════════════════════
   SYLLABUS CHECKLIST TAB
═══════════════════════════════════════════════════════════════ */
function ChecklistTab({t}){
  const examNames=Object.keys(EXAM_DATA);
  const [selExam,setSelExam]=useState(examNames[0]);
  const [selPhase,setSelPhase]=useState('prelims');
  const [checked,setChecked]=useState({});

  const exam=EXAM_DATA[selExam];
  const phaseKeys=Object.keys(exam).filter(k=>!['color','priority','vacancies'].includes(k));
  const phaseData=exam[selPhase]||exam[phaseKeys[0]];
  const phaseLabels={prelims:'Prelims',mains:'Mains',interview:'Interview',skill:'Skill Test'};

  const changeExam=(name)=>{
    setSelExam(name);
    const keys=Object.keys(EXAM_DATA[name]).filter(k=>!['color','priority','vacancies'].includes(k));
    setSelPhase(keys[0]);
  };

  const toggleItem=useCallback((key)=>setChecked(p=>({...p,[key]:!p[key]})),[]);

  const getOverallProg=()=>{
    let tot=0,dn=0;
    phaseKeys.forEach(pk=>{
      const pd=exam[pk];
      if(pd?.sections) Object.values(pd.sections).flat().forEach(item=>{tot++;if(checked[`${selExam}||${pk}||${item}`])dn++;});
    });
    return tot?Math.round((dn/tot)*100):0;
  };
  const getPhaseProg=()=>{
    if(!phaseData?.sections)return{done:0,total:0};
    let tot=0,dn=0;
    Object.values(phaseData.sections).flat().forEach(item=>{tot++;if(checked[`${selExam}||${selPhase}||${item}`])dn++;});
    return{done:dn,total:tot};
  };

  const prog=getOverallProg();
  const {done,total}=getPhaseProg();
  const allChk=phaseData?.sections&&Object.values(phaseData.sections).flat().every(i=>checked[`${selExam}||${selPhase}||${i}`]);

  const toggleAll=()=>{
    if(!phaseData?.sections)return;
    const nc={...checked};
    Object.values(phaseData.sections).flat().forEach(i=>{nc[`${selExam}||${selPhase}||${i}`]=!allChk;});
    setChecked(nc);
  };

  return (
    <div>
      <div style={{marginBottom:18}}>
        <SectionLabel t={t}>Select Exam</SectionLabel>
        <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
          {examNames.map(name=>{
            const ed=EXAM_DATA[name];const ia=name===selExam;
            return <button key={name} onClick={()=>changeExam(name)}
              style={{padding:'5px 10px',borderRadius:7,border:`1px solid ${ia?ed.color:t.border}`,background:ia?`${ed.color}18`:'transparent',color:ia?ed.color:t.textMuted,fontSize:10,fontFamily:t.mono,transition:'all 0.15s'}}>{name}</button>;
          })}
        </div>
      </div>

      <div style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:12,padding:15,marginBottom:14,borderTop:`3px solid ${exam.color}`}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:8}}>
          <div>
            <div style={{fontSize:14,fontWeight:800,color:t.text}}>{selExam}</div>
            <div style={{fontSize:10,fontFamily:t.mono,color:t.textMuted,marginTop:3}}>
              <span style={{color:exam.color}}>{exam.priority}</span>
              {exam.vacancies&&<span> · {exam.vacancies} Vacancies</span>}
            </div>
          </div>
          <div style={{textAlign:'right'}}>
            <div style={{fontSize:22,fontWeight:800,fontFamily:t.mono,color:prog>=80?'#00b47a':prog>=40?'#fb923c':t.textMuted,lineHeight:1}}>{prog}%</div>
            <div style={{fontSize:9,color:t.textMuted,fontFamily:t.mono}}>OVERALL</div>
          </div>
        </div>
        <div style={{height:4,background:t.border,borderRadius:2,marginTop:10,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${prog}%`,background:`linear-gradient(90deg,${exam.color},${exam.color}bb)`,borderRadius:2,transition:'width 0.4s'}}/>
        </div>
      </div>

      <div style={{display:'flex',gap:6,marginBottom:12,flexWrap:'wrap'}}>
        {phaseKeys.map(pk=>(
          <button key={pk} onClick={()=>setSelPhase(pk)}
            style={{padding:'6px 12px',borderRadius:7,border:`1px solid ${selPhase===pk?exam.color:t.border}`,background:selPhase===pk?`${exam.color}18`:'transparent',color:selPhase===pk?exam.color:t.textMuted,fontSize:11,fontFamily:t.mono,textTransform:'capitalize'}}>
            {phaseLabels[pk]||pk}
          </button>
        ))}
      </div>

      {phaseData?.pattern&&(
        <div style={{background:`${exam.color}0d`,border:`1px solid ${exam.color}25`,borderRadius:8,padding:'9px 13px',marginBottom:12,fontSize:11,color:exam.color,fontFamily:t.mono,lineHeight:1.5}}>
          📋 {phaseData.pattern}
        </div>
      )}

      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:11,color:t.textMuted,fontFamily:t.mono}}>{done}/{total} topics covered</div>
        <button onClick={toggleAll} style={{fontSize:10,fontFamily:t.mono,padding:'4px 10px',borderRadius:6,border:`1px solid ${t.border}`,background:'transparent',color:t.textMuted}}>
          {allChk?'✓ Uncheck All':'Check All'}
        </button>
      </div>

      {phaseData?.sections&&Object.entries(phaseData.sections).map(([section,items])=>{
        const sdone=items.filter(i=>checked[`${selExam}||${selPhase}||${i}`]).length;
        return (
          <div key={section} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:10,marginBottom:12,overflow:'hidden'}}>
            <div style={{padding:'10px 14px',borderBottom:`1px solid ${t.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,fontWeight:700,color:t.text}}>{section}</div>
              <div style={{fontSize:10,fontFamily:t.mono,color:sdone===items.length?'#00b47a':t.textMuted}}>{sdone}/{items.length}</div>
            </div>
            <div style={{padding:'6px 10px'}}>
              {items.map((item,i)=>{
                const key=`${selExam}||${selPhase}||${item}`;
                const ic=!!checked[key];
                return (
                  <div key={i} className="check-item" onClick={()=>toggleItem(key)}
                    style={{'--hover-bg':t.inputBg,display:'flex',alignItems:'flex-start',gap:10,padding:'7px 6px',cursor:'pointer'}}>
                    <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${ic?exam.color:t.border2}`,background:ic?exam.color:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all 0.15s'}}>
                      {ic&&<span style={{color:'#fff',fontSize:11,fontWeight:700,lineHeight:1}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,color:ic?t.textMuted:t.text,textDecoration:ic?'line-through':'none',lineHeight:1.55,transition:'all 0.15s'}}>{item}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PHASE CHECKLISTS TAB
═══════════════════════════════════════════════════════════════ */
function PhaseChecklistTab({t}){
  const names=Object.keys(PHASE_CHECKLISTS);
  const [selPhase,setSelPhase]=useState(names[0]);
  const [checked,setChecked]=useState({});
  const phase=PHASE_CHECKLISTS[selPhase];
  const toggleItem=useCallback((key)=>setChecked(p=>({...p,[key]:!p[key]})),[]);

  const getProg=(name)=>{
    const ph=PHASE_CHECKLISTS[name];
    const items=Object.values(ph.sections).flat();
    const dn=items.filter(i=>checked[`${name}||${i}`]).length;
    return items.length?Math.round((dn/items.length)*100):0;
  };
  const curItems=Object.values(phase.sections).flat();
  const curDone=curItems.filter(i=>checked[`${selPhase}||${i}`]).length;
  const allChk=curItems.every(i=>checked[`${selPhase}||${i}`]);
  const toggleAll=()=>{
    const nc={...checked};
    curItems.forEach(i=>{nc[`${selPhase}||${i}`]=!allChk;});
    setChecked(nc);
  };

  return (
    <div>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:18}}>
        {names.map(name=>{
          const ph=PHASE_CHECKLISTS[name];const ia=name===selPhase;
          return (
            <button key={name} onClick={()=>setSelPhase(name)}
              style={{padding:'8px 13px',borderRadius:9,border:`1px solid ${ia?ph.color:t.border}`,background:ia?`${ph.color}18`:'transparent',color:ia?ph.color:t.textMuted,fontSize:10,fontFamily:t.mono,cursor:'pointer',display:'flex',flexDirection:'column',gap:2,transition:'all 0.15s'}}>
              <span>{name.split('—')[0].trim()}</span>
              <span style={{fontSize:9,opacity:0.8}}>{getProg(name)}% done</span>
            </button>
          );
        })}
      </div>

      <div style={{background:`${phase.color}10`,border:`1px solid ${phase.color}28`,borderRadius:10,padding:'13px 15px',marginBottom:14}}>
        <div style={{fontSize:13,fontWeight:800,color:phase.color,marginBottom:8}}>{selPhase}</div>
        <div style={{height:4,background:t.border,borderRadius:2,overflow:'hidden'}}>
          <div style={{height:'100%',width:`${getProg(selPhase)}%`,background:phase.color,borderRadius:2,transition:'width 0.4s'}}/>
        </div>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
          <div style={{fontSize:10,color:t.textMuted,fontFamily:t.mono}}>{curDone}/{curItems.length} items</div>
          <button onClick={toggleAll} style={{fontSize:10,fontFamily:t.mono,padding:'3px 9px',borderRadius:5,border:`1px solid ${t.border}`,background:'transparent',color:t.textMuted,cursor:'pointer'}}>
            {allChk?'✓ Uncheck All':'Check All'}
          </button>
        </div>
      </div>

      {Object.entries(phase.sections).map(([section,items])=>{
        const sdone=items.filter(i=>checked[`${selPhase}||${i}`]).length;
        return (
          <div key={section} style={{background:t.surface,border:`1px solid ${t.border}`,borderRadius:10,marginBottom:12,overflow:'hidden'}}>
            <div style={{padding:'10px 14px',borderBottom:`1px solid ${t.border}`,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <div style={{fontSize:12,fontWeight:700,color:t.text}}>{section}</div>
              <div style={{fontSize:10,fontFamily:t.mono,color:sdone===items.length?'#00b47a':t.textMuted}}>{sdone}/{items.length}</div>
            </div>
            <div style={{padding:'6px 10px'}}>
              {items.map((item,i)=>{
                const key=`${selPhase}||${item}`;const ic=!!checked[key];
                return (
                  <div key={i} className="check-item" onClick={()=>toggleItem(key)}
                    style={{'--hover-bg':t.inputBg,display:'flex',alignItems:'flex-start',gap:10,padding:'7px 6px',cursor:'pointer'}}>
                    <div style={{width:18,height:18,borderRadius:5,border:`2px solid ${ic?phase.color:t.border2}`,background:ic?phase.color:'transparent',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0,marginTop:1,transition:'all 0.15s'}}>
                      {ic&&<span style={{color:'#fff',fontSize:11,fontWeight:700,lineHeight:1}}>✓</span>}
                    </div>
                    <span style={{fontSize:12,color:ic?t.textMuted:t.text,textDecoration:ic?'line-through':'none',lineHeight:1.55,transition:'all 0.15s'}}>{item}</span>
                  </div>
                );
              })}
            </div>
          </div>
        );
      })}
    </div>
  );
}

    ['Weak Sections = Hidden Topper Secret','2% gain in strong section = 1 mark. 2% gain in weak section = 4 marks. Allocate 40% drill time to your weakest areas.'],
    ['Never Skip Mock Analysis','Mock without analysis = 3 hours wasted. The error map is worth more than the score. 2 hours post-mock > 3 hours of the mock itself.'],
    ['22-Exam Advantage is Real',"Every exam makes the next easier — you've seen the pressure, the UI, the crunch. UPCISBL and MP Apex are live rehearsals for IBPS PO."],
    ['Energy Management > Time Management','Tired mind = useless study. 20 min CA and sleep > 3 hours of depleted half-study. Protect your morning block fiercely.'],
    ['One Week at a Time',"22 exams = paralysis if you stare at all of them. Focus on this week's schedule only. The plan is built — trust it and execute."],
    ['Error Notebook = Most Valuable Asset','Every wrong answer: question type + trap + correct approach. Review every Sunday. By exam day, every trap is mapped.'],
    ['GK is Not Last-Minute','1000+ items to memorize. Anki: 10 new cards/day = 1800 cards in 6 months. The only way is distributed repetition. Start today.'],
    ['UPCISBL Cooperative Knowledge is Unique','Only exam with Cooperative Laws & UP Cooperative Bank history. 25 marks in Mains (15+10). Others skip this. This is extra edge.'],
  ];
  return (
    <div>
      {rules.map(([title,body],i)=>(
        <div key={i} style={{display:'flex',gap:14,padding:'14px 0',borderBottom:`1px solid ${t.border}`}}>
          <div style={{fontFamily:t.mono,fontSize:18,fontWeight:700,color:`${t.accent}28`,minWidth:30,lineHeight:1}}>{String(i+1).padStart(2,'0')}</div>
          <div>
            <div style={{fontSize:13,fontWeight:700,color:t.text,marginBottom:4}}>{title}</div>
            <div style={{fontSize:12,color:t.textMuted,lineHeight:1.7}}>{body}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   APP ROOT
═══════════════════════════════════════════════════════════════ */
const TABS=[
  {id:'overview',label:'Overview'},
  {id:'upcisbl',label:'UPCISBL 2026'},
  {id:'daily',label:'Daily Plan'},
  {id:'weekly',label:'Weekly'},
  {id:'checklist',label:'✓ Syllabus'},
  {id:'phases',label:'✓ Phase Lists'},
  {id:'rules',label:'Rules'},
];

function App(){
  const [activeTab,setActiveTab]=useState('overview');
  const [dark,setDark]=useState(true);
  const t=THEMES[dark?'dark':'light'];

  const renderTab=()=>{
    const p={t};
    switch(activeTab){
      case 'overview': return <OverviewTab {...p}/>;
      case 'upcisbl':  return <UPCISBLTab {...p}/>;
      case 'daily':    return <DailyTab {...p}/>;
      case 'weekly':   return <WeeklyTab {...p}/>;
      case 'checklist':return <ChecklistTab {...p}/>;
      case 'phases':   return <PhaseChecklistTab {...p}/>;
      case 'rules':    return <RulesTab {...p}/>;
      default:         return <OverviewTab {...p}/>;
    }
  };

  return (
    <div style={{fontFamily:"'Syne','Segoe UI',system-ui,sans-serif",background:t.bg,minHeight:'100vh',color:t.text,transition:'background 0.25s,color 0.25s'}}>

      {/* HEADER */}
      <div style={{borderBottom:`1px solid ${t.border}`,padding:'13px 16px 10px',background:t.headerBg,backdropFilter:'blur(12px)',WebkitBackdropFilter:'blur(12px)',position:'sticky',top:0,zIndex:100}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
          <div>
            <div style={{fontFamily:t.mono,fontSize:8,letterSpacing:3,color:t.accent,textTransform:'uppercase',marginBottom:3,opacity:0.8}}>// EXAM OPS CENTER</div>
            <div style={{fontSize:18,fontWeight:800,color:t.text,letterSpacing:'-0.5px',lineHeight:1.2}}>
              Omni-Prep <span style={{color:t.accent}}>2026–27</span>
            </div>
            <div style={{fontFamily:t.mono,fontSize:9,color:t.textMuted,marginTop:2}}>22 EXAMS · 3 PHASES · WORKING PRO EDITION</div>
          </div>
          <button onClick={()=>setDark(!dark)}
            style={{padding:'8px 12px',borderRadius:8,border:`1px solid ${t.border}`,background:t.surface,color:t.textDim,fontSize:16,flexShrink:0,transition:'all 0.2s',lineHeight:1}}>
            {dark?'☀️':'🌙'}
          </button>
        </div>
      </div>

      {/* TAB BAR */}
      <div className="tab-bar" style={{display:'flex',padding:'0 4px',borderBottom:`1px solid ${t.border}`,overflowX:'auto',background:t.headerBg}}>
        {TABS.map(tab=>(
          <button key={tab.id} onClick={()=>setActiveTab(tab.id)}
            style={{fontFamily:t.mono,fontSize:9,letterSpacing:'0.8px',textTransform:'uppercase',padding:'10px 11px',border:'none',background:activeTab===tab.id?t.tabBg:'transparent',color:activeTab===tab.id?t.accent:t.textMuted,borderBottom:`2px solid ${activeTab===tab.id?t.accent:'transparent'}`,whiteSpace:'nowrap',transition:'all 0.15s',flexShrink:0}}>
            {tab.label}
          </button>
        ))}
      </div>

      {/* CONTENT */}
      <div style={{padding:'18px 14px',maxWidth:920,margin:'0 auto'}}>
        {renderTab()}
      </div>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
